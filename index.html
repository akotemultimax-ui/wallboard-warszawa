<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Wallboard Warszawa</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
<iframe id="wallboard" src="https://docs.google.com/presentation/d/1T1IjhBUZfnY3nXuJowqcbqno-3QW6YqrFfx4d4Ee6QQ/embed?start=true&loop=true&delayms=5000"></iframe>
  <script>
  // Odświeżanie co 30 sekund (30000 ms)
  const REFRESH_INTERVAL = 30000; 

  setInterval(function() {
    const iframe = document.getElementById('wallboard');
    const baseUrl = "https://docs.google.com/presentation/d/1T1IjhBUZfnY3nXuJowqcbqno-3QW6YqrFfx4d4Ee6QQ/embed?start=true&loop=true&delayms=5000";
    
    // Dodajemy losowy paramter t=..., żeby Google wymusiło pobranie nowej wersji obrazu
    iframe.src = baseUrl + "&t=" + new Date().getTime();
  }, REFRESH_INTERVAL);
</script>
</body>
</html>
